<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <rect width="1600" height="980" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #ffffff; }
      .group-title { font-size: 30px; font-weight: 700; }
      .item { font-size: 25px; font-weight: 600; fill: #0f172a; }
      .desc { font-size: 20px; font-weight: 400; fill: #334155; }
      .note { font-size: 22px; font-weight: 400; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="640" y="38" width="320" height="82" rx="18" fill="#0f172a"/>
  <text x="800" y="91" text-anchor="middle" class="title">Phishing</text>

  <path d="M800 120 V178" class="line"/>
  <path d="M800 178 H330 V220" class="line"/>
  <path d="M800 178 H800 V220" class="line"/>
  <path d="M800 178 H1270 V220" class="line"/>

  <rect x="80" y="220" width="500" height="500" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <rect x="110" y="250" width="440" height="58" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="289" text-anchor="middle" class="group-title" fill="#1e3a8a">Por canal</text>

  <text x="130" y="365" class="item">E-mail phishing</text>
  <text x="130" y="397" class="desc">mensagens fraudulentas por e-mail</text>

  <text x="130" y="465" class="item">Smishing</text>
  <text x="130" y="497" class="desc">golpes por SMS ou mensagem curta</text>

  <text x="130" y="565" class="item">Vishing</text>
  <text x="130" y="597" class="desc">golpes por ligação ou voz</text>

  <text x="130" y="665" class="item">Quishing</text>
  <text x="130" y="697" class="desc">golpes por QR Code</text>

  <rect x="620" y="220" width="360" height="500" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
  <rect x="650" y="250" width="300" height="58" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="289" text-anchor="middle" class="group-title" fill="#14532d">Por alvo</text>

  <text x="670" y="380" class="item">Spear phishing</text>
  <text x="670" y="412" class="desc">direcionado a pessoas</text>
  <text x="670" y="440" class="desc">ou grupos específicos</text>

  <text x="670" y="535" class="item">Whaling / BEC</text>
  <text x="670" y="567" class="desc">voltado a executivos,</text>
  <text x="670" y="595" class="desc">gestores ou alto perfil</text>

  <rect x="1020" y="220" width="500" height="500" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
  <rect x="1050" y="250" width="440" height="58" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1270" y="289" text-anchor="middle" class="group-title" fill="#78350f">Por técnica ou objetivo</text>

  <text x="1070" y="395" class="item">Malware phishing</text>
  <text x="1070" y="427" class="desc">induz abertura de anexos,</text>
  <text x="1070" y="455" class="desc">links ou arquivos maliciosos</text>

  <text x="1070" y="560" class="item">Clone phishing</text>
  <text x="1070" y="592" class="desc">clona mensagem, página ou</text>
  <text x="1070" y="620" class="desc">identidade visual legítima</text>

  <rect x="120" y="790" width="1360" height="120" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="800" y="835" text-anchor="middle" class="note">
    As categorias podem se sobrepor: um ataque direcionado pode ocorrer por e-mail, SMS,
  </text>
  <text x="800" y="870" text-anchor="middle" class="note">
    ligação ou QR Code, e ainda entregar malware ou usar clonagem de mensagens e páginas.
  </text>
</svg>
